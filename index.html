<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Vayal Fresh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Mukta+Malar:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: mobile-first app shell (bottom tabs) that becomes a top-nav storefront when the app container is wide; container queries so the "App preview" frame shows the true mobile app. */
:root{
  --bg:#F2F5EC; --surface:#FFFFFF; --sunk:#E8EEE1; --ink:#15241B; --muted:#5A6A5F; --line:#D8E0D1;
  --leaf:#1E5C38; --leaf-ink:#FFFFFF; --leaf-soft:#DDEBD8; --turmeric:#D99A12; --turmeric-soft:#FBEFCF;
  --chili:#B93A26; --chili-soft:#F8E1DB; --sky:#2F6F8F;
  --f-display:"Bricolage Grotesque", "Mukta Malar", system-ui, sans-serif;
  --f-body:"Mukta Malar", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:14px; --shadow:0 1px 2px rgba(20,40,25,.06),0 6px 20px rgba(20,40,25,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1611; --surface:#16211A; --sunk:#1B2820; --ink:#E6EEE4; --muted:#9CAC9F; --line:#2A392F;
  --leaf:#63C08A; --leaf-ink:#0B1A10; --leaf-soft:#1C3325; --turmeric:#F0B83A; --turmeric-soft:#3A2F12;
  --chili:#F07F66; --chili-soft:#3A1E18; --sky:#7FB8D6; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1611; --surface:#16211A; --sunk:#1B2820; --ink:#E6EEE4; --muted:#9CAC9F; --line:#2A392F;
  --leaf:#63C08A; --leaf-ink:#0B1A10; --leaf-soft:#1C3325; --turmeric:#F0B83A; --turmeric-soft:#3A2F12;
  --chili:#F07F66; --chili-soft:#3A1E18; --sky:#7FB8D6; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--turmeric);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.7rem;line-height:1.15} h2{font-size:1.2rem} h3{font-size:1rem}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.85rem} .tiny{font-size:.75rem}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ta{font-family:"Mukta Malar",sans-serif}

/* stage + phone preview */
#stage{min-height:100%}
#stage.phone{display:grid;place-items:start center;padding-block:24px;padding-inline:16px}
#stage.phone #frame{width:390px;max-width:100%;height:800px;max-height:calc(100vh - 48px);overflow:hidden;border:10px solid #111;border-radius:40px;transform:translateZ(0);background:var(--bg);box-shadow:0 20px 60px rgba(0,0,0,.25)}
#stage.phone #app{height:100%;overflow-y:auto}
#app{container-type:inline-size;container-name:app;position:relative;min-height:100%}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:1180px;margin:0 auto}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:1.25rem;border:0;background:none;padding:0;color:var(--ink)}
.logo-mark{width:30px;height:30px;border-radius:9px;background:var(--leaf);display:grid;place-items:center;color:var(--leaf-ink)}
.logo small{white-space:nowrap;font-family:var(--f-body);font-weight:500;font-size:.72rem;color:var(--muted);display:block;line-height:1}
.deliver{display:none;flex-direction:column;border:0;background:none;text-align:left;padding:0 8px;border-left:1px solid var(--line);min-width:0}
.deliver b{font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:none;gap:4px;margin-left:auto}
.nav button{white-space:nowrap;border:0;background:none;padding:8px 12px;border-radius:10px;font-weight:600;color:var(--muted)}
.nav button[aria-current="page"]{color:var(--ink);background:var(--sunk)}
.top-actions{display:flex;gap:6px;margin-left:auto;align-items:center}
.icon-btn{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.icon-btn svg{width:20px;height:20px}
.badge{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;border-radius:10px;background:var(--turmeric);color:#1a1300;font-size:.7rem;font-weight:700;display:grid;place-items:center;padding:0 5px}
.pill-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.82rem;white-space:nowrap}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.lang button{border:0;background:none;padding:6px 10px;font-size:.8rem;font-weight:600;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--leaf);color:var(--leaf-ink)}
.preview-btn{display:none}

main{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:14px 150px;display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
main>*{min-width:0}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{border:0;background:none;padding:8px 2px 10px;display:grid;justify-items:center;gap:2px;font-size:.7rem;font-weight:600;color:var(--muted)}
.tabs svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--leaf)}
.cartbar{position:fixed;left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:29;background:var(--leaf);color:var(--leaf-ink);border:0;border-radius:14px;padding:11px 16px;display:flex;align-items:center;justify-content:space-between;font-weight:700;box-shadow:var(--shadow)}
.fab{position:fixed;right:14px;bottom:calc(128px + env(safe-area-inset-bottom,0px));z-index:31;border:0;border-radius:999px;background:var(--ink);color:var(--bg);padding:11px 16px 11px 12px;display:flex;align-items:center;gap:8px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.fab svg{width:20px;height:20px;color:var(--turmeric)}

/* search */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 6px 4px 12px}
.search input{flex:1;border:0;background:none;padding:9px 0;min-width:0;outline:none}
.search svg{width:19px;height:19px;color:var(--muted);flex:none}
.search .icon-btn{width:36px;height:36px;border:0;background:var(--sunk)}

/* generic */
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
.link{border:0;background:none;color:var(--leaf);font-weight:700;padding:0}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--leaf);color:var(--leaf-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.warm{background:var(--turmeric);color:#1a1300}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:14px}
.vm{display:inline-block;width:12px;height:12px;border:1.5px solid #2e8b3d;border-radius:2px;position:relative;vertical-align:-1px;margin-right:6px;flex:none}.vm::after{content:"";position:absolute;inset:2px;border-radius:50%;background:#2e8b3d}.vm.nv{border-color:#c0392b}.vm.nv::after{background:#c0392b}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:.74rem;font-weight:600;background:var(--sunk);color:var(--ink);white-space:nowrap}
.chip.good{background:var(--leaf-soft);color:var(--leaf)}
.chip.warn{background:var(--chili-soft);color:var(--chili)}
.chip.gold{background:var(--turmeric-soft);color:color-mix(in srgb,var(--turmeric) 60%,var(--ink))}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.hscroll>*{flex:none}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:.85rem;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.divider{height:1px;background:var(--line)}
.back{border:0;background:none;display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--muted);padding:0}
.back svg{width:18px;height:18px}
label.fld{display:grid;gap:4px;font-size:.85rem;font-weight:600}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;font-weight:400}

/* hero */
.hero{border-radius:20px;background:var(--leaf);color:var(--leaf-ink);padding:20px;display:grid;gap:12px;position:relative;overflow:hidden}
.hero h1{font-size:1.6rem;max-width:18ch}
.hero p{opacity:.88;max-width:40ch}
.hero .btn{background:var(--turmeric);color:#1a1300;justify-self:start}
.hero-art{position:absolute;right:-10px;bottom:-18px;font-size:6.5rem;opacity:.95;transform:rotate(-8deg);pointer-events:none;line-height:1}
.hero .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;opacity:.9}
.hero .meta span{display:inline-flex;gap:5px;align-items:center}
.hero svg{width:16px;height:16px}

/* category tiles */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cat{border:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 4px;display:grid;justify-items:center;gap:4px;font-size:.76rem;font-weight:600;text-align:center;line-height:1.2}
.cat .em{font-size:1.7rem;line-height:1}

/* product grid */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;grid-template-rows:auto auto 1fr auto;gap:6px;min-width:0}
.hscroll .pcard{width:168px}
.pimg{border:0;border-radius:11px;aspect-ratio:4/3;display:grid;place-items:center;font-size:2.8rem;position:relative;width:100%;max-width:100%;padding:0}
.pimg .tag{position:absolute;top:6px;left:6px}
.pname{border:0;background:none;padding:0;text-align:left;font-weight:700;line-height:1.25;font-size:.92rem}
.pname .ta{display:block;font-weight:500;font-size:.78rem;color:var(--muted)}
.price{display:flex;align-items:baseline;gap:6px}
.price b{font-family:var(--f-mono);font-size:.98rem}
.price s{font-size:.78rem;color:var(--muted)}
.pfoot{display:flex;justify-content:space-between;align-items:end;gap:6px}
.add{border:1.5px solid var(--leaf);background:var(--leaf-soft);color:var(--leaf);border-radius:10px;padding:6px 14px;font-weight:800;font-size:.85rem}
.stepper{display:inline-flex;align-items:center;border-radius:10px;background:var(--leaf);color:var(--leaf-ink);overflow:hidden}
.stepper button{border:0;background:none;color:inherit;width:30px;height:32px;display:grid;place-items:center;font-weight:800;font-size:1.05rem}
.stepper span{min-width:20px;text-align:center;font-weight:700;font-family:var(--f-mono);font-size:.9rem}

/* recipe cards */
.rcard{width:220px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:0;text-align:left;overflow:hidden;display:grid}
.rcard .rart{height:92px;display:grid;place-items:center;font-size:2.6rem;background:var(--turmeric-soft)}
.rcard .rbody{padding:10px 12px;display:grid;gap:4px}

/* product detail */
.pd{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
.pd-art{border-radius:20px;aspect-ratio:16/10;display:grid;place-items:center;font-size:7rem;max-width:100%}
.pd-buy{display:grid;gap:12px}
.variant{display:flex;gap:8px;flex-wrap:wrap}
.variant button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;text-align:left;font-weight:600;font-size:.85rem}
.variant button[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-soft)}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.fact{background:var(--sunk);border-radius:12px;padding:8px;text-align:center}
.fact b{display:block;font-family:var(--f-mono);font-size:1rem}
.fact span{font-size:.7rem;color:var(--muted)}
.tabbar{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabbar button{border:0;background:none;padding:10px 12px;font-weight:700;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap}
.tabbar button[aria-selected="true"]{color:var(--ink);border-color:var(--turmeric)}
.list{margin:0;padding-left:1.1rem;display:grid;gap:6px}
.cam{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#0d1b12;color:#fff}
.cam .sky{position:absolute;inset:0;background:linear-gradient(#9fd3ee,#e9f5df 62%)}
.cam .ground{position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(#6aa84f,#3f7d3a)}
.cam .hill{position:absolute;bottom:38%;left:-10%;width:70%;height:30%;border-radius:50%;background:#7fb86a}.cam .hill.b{left:35%;width:80%;background:#6aa557}
.cam .sun{position:absolute;top:10%;right:12%;width:9%;aspect-ratio:1;border-radius:50%;background:#ffd45c;box-shadow:0 0 28px 10px #ffe9a1;animation:pulse 4s ease-in-out infinite}
.cam .row-e{position:absolute;left:0;right:0;display:flex;justify-content:space-around;font-size:clamp(20px,5vw,40px)}
.cam .row-e span{display:inline-block;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite}.cam .row-e span:nth-child(2n){animation-delay:-1.1s}.cam .row-e span:nth-child(3n){animation-delay:-2s}
.cam .walker{position:absolute;font-size:clamp(24px,6vw,46px);animation:walk 18s linear infinite}
.cam .bird{position:absolute;top:18%;font-size:clamp(12px,2.4vw,20px);animation:fly 14s linear infinite}
.cam .shed{position:absolute;inset:0;background:linear-gradient(#caa97a,#8b6b43)}
.cam .live{position:absolute;top:10px;left:10px;display:flex;gap:6px;align-items:center;background:rgba(0,0,0,.6);padding:4px 9px;border-radius:99px;font-size:.75rem;font-weight:700}
.cam .live i{width:8px;height:8px;border-radius:50%;background:#ff3b30;animation:pulse 1.2s infinite}
.cam .hud{position:absolute;left:10px;right:10px;bottom:8px;display:flex;justify-content:space-between;font-size:.72rem;text-shadow:0 1px 3px #000;gap:8px;flex-wrap:wrap}
.cam iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes pulse{50%{opacity:.55}}
@keyframes walk{from{left:-8%}to{left:104%}}@keyframes fly{from{left:-5%;top:18%}50%{top:10%}to{left:105%;top:20%}}
@media (prefers-reduced-motion:reduce){.cam *{animation:none!important}}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.farm{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.farm-av{width:48px;height:48px;border-radius:50%;background:var(--turmeric-soft);display:grid;place-items:center;font-weight:800;font-family:var(--f-display);color:var(--ink)}
.trace{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:.72rem;text-align:center}
.trace div{border-top:3px solid var(--leaf);padding-top:6px}
.fit{border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;font-size:.88rem}
.fit.good{background:var(--leaf-soft)} .fit.warn{background:var(--chili-soft)}
.fit svg{width:18px;height:18px;flex:none;margin-top:2px}

/* cart */
.line{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.thumb{width:52px;height:52px;border-radius:10px;display:grid;place-items:center;font-size:1.7rem}
.slots{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.slot{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 10px;text-align:left}
.slot[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-soft)}
.slot b{display:block;font-size:.86rem} .slot span{font-size:.74rem;color:var(--muted)}
.bill{display:grid;gap:6px;font-size:.9rem}
.bill .between span:last-child{font-family:var(--f-mono)}
.bill .total{font-weight:800;font-size:1.02rem;padding-top:8px;border-top:1px dashed var(--line)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface)}
.opt input{margin-top:4px;accent-color:var(--leaf)}
.opt:has(input:checked){border-color:var(--leaf);background:var(--leaf-soft)}
.two{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}

/* tracking */
.steps{display:grid;gap:0}
.stp{display:grid;grid-template-columns:28px 1fr;gap:12px;position:relative;padding-bottom:18px}
.stp:before{content:"";position:absolute;left:13px;top:26px;bottom:0;width:2px;background:var(--line)}
.stp:last-child:before{display:none}
.stp.done:before{background:var(--leaf)}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center}
.dot svg{width:15px;height:15px}
.stp.done .dot{background:var(--leaf);border-color:var(--leaf);color:var(--leaf-ink)}
.stp.now .dot{border-color:var(--turmeric);box-shadow:0 0 0 4px var(--turmeric-soft)}
.otp{font-family:var(--f-mono);font-size:1.4rem;letter-spacing:.3em;font-weight:500}

/* subs */
.sub{display:grid;grid-template-columns:52px 1fr;gap:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cal button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 0;font-size:.7rem;line-height:1.2;text-align:center}
.cal button b{display:block;font-family:var(--f-mono);font-size:.82rem}
.cal button.on{background:var(--leaf-soft);border-color:var(--leaf)}
.cal button.skip{background:var(--sunk);color:var(--muted);text-decoration:line-through}

/* planner */
.week{display:grid;gap:8px}
.day{display:grid;grid-template-columns:52px 1fr 1fr;gap:8px;align-items:stretch}
.day .dname{font-weight:800;font-family:var(--f-display);display:grid;align-content:center}
.meal{border:1px dashed var(--line);background:var(--surface);border-radius:12px;padding:8px;text-align:left;font-size:.82rem;min-width:0;display:grid;gap:2px}
.meal.set{border-style:solid}
.meal b{font-size:.84rem;line-height:1.2}

/* modal & sheet */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(10,20,14,.45);display:grid;align-items:end}
.sheet{background:var(--bg);border-radius:20px 20px 0 0;max-height:88%;overflow-y:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;width:100%;max-width:640px;margin:0 auto}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}

/* assistant */
.chat{position:fixed;inset:0;z-index:70;background:var(--bg);display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}
.chat-head{display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.chat-head .av{width:36px;height:36px;border-radius:12px;background:var(--ink);color:var(--turmeric);display:grid;place-items:center}
.chat-head .av svg{width:20px;height:20px}
.msgs{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;font-size:.93rem;line-height:1.5;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--leaf);color:var(--leaf-ink);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.bot ul{margin:4px 0;padding-left:1.1rem}
.msg.bot p+p{margin-top:6px}
.msg .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.msg.sys{align-self:center;font-size:.76rem;color:var(--muted);background:none;padding:2px}
.sugg{display:flex;gap:6px;overflow-x:auto;padding:0 16px 8px}
.sugg button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.8rem;font-weight:600}
.composer{display:flex;gap:8px;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.composer input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}
.typing{display:inline-flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,100%{opacity:.3}50%{opacity:1}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.88rem;box-shadow:var(--shadow);max-width:90%}
.empty{text-align:center;padding:40px 16px;display:grid;gap:10px;justify-items:center}
.empty .big{font-size:3rem}
.star{border:0;background:none;padding:0 1px;font-size:1.2rem;color:var(--line)}
.star.on{color:var(--turmeric)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.sw{appearance:none;width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw:before{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.sw:checked{background:var(--leaf)} .sw:checked:before{left:21px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- wide (web storefront) ---------- */
@container app (min-width:820px){
  .deliver{display:flex}
  .nav{display:flex}
  .top-actions{margin-left:8px}
  .preview-btn{display:inline-flex}
  .tabs{display:none}
  .cartbar{display:none}
  .fab{bottom:24px;right:24px}
  .toast{bottom:90px}
  main{padding-block:22px 110px;gap:30px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
  .cats{grid-template-columns:repeat(8,1fr)}
  .hero{padding:34px 36px;grid-template-columns:1fr}
  .hero h1{font-size:2.4rem}
  .hero-art{font-size:10rem;right:40px;bottom:-24px}
  h1{font-size:2rem}
  .pd{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);align-items:start;gap:30px}
  .two{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start}
  .slots{grid-template-columns:repeat(3,1fr)}
  .scrim{align-items:center}
  .sheet{border-radius:20px;max-height:84vh}
  .chat{inset:auto 24px 24px auto;width:410px;height:min(680px,calc(100vh - 48px));border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.22)}
  .chat-head{padding-top:12px}
  .week{grid-template-columns:repeat(7,minmax(0,1fr))}
  .day{grid-template-columns:1fr;align-content:start}
  .day .dname{text-align:center}
}

 p.allergens.forEach(a=>{if(pr.allergens.includes(a))warn.push("Contains "+ALLERGENS[a].toLowerCase())});
 if(p.nv&&pr.diet!=="all")warn.push("Non-vegetarian");
 if(pr.diet==="vegan"&&(p.allergens.includes("dairy")||p.allergens.includes("egg")))warn.push("Not vegan");
 if(pr.diet==="veg"&&p.allergens.includes("egg"))warn.push("Contains egg");
 if(pr.goals.includes("diabetic")&&(p.id==="karupatti"||p.id==="honey"))warn.push("High sugar: limit if diabetic");
 return {good,warn,ok:!warn.length&&good.length>0};
}
const vmark=p=>p.nv?`<span class="vm nv" role="img" aria-label="Non-vegetarian" title="Non-vegetarian"></span>`:p.allergens.includes("egg")?"":`<span class="vm" role="img" aria-label="Vegetarian" title="Vegetarian"></span>`;
function fitChip(p){const f=fit(p);if(f.warn.length)return `<span class="chip warn tag">${esc(f.warn[0])}</span>`;if(f.good.length)return `<span class="chip good tag">${svg("check",'width="12" height="12"')} ${esc(TAGS[f.good[0]][S.lang==="ta"?"ta":"en"])}</span>`;return ""}

/* cart */
const key=(id,ui)=>id+"|"+ui;
function cartQty(id,ui){return S.cart[key(id,ui??(S.pdUnit[id]||0))]||0}
function addCart(id,ui=0,n=1,quiet){const k=key(id,ui);S.cart[k]=Math.max(0,(S.cart[k]||0)+n);if(!S.cart[k])delete S.cart[k];save();if(!quiet&&n>0)toast(`${nm(PM[id])} ${S.lang==="ta"?"சேர்க்கப்பட்டது":"added"}`);refresh()}
function cartLines(){return Object.entries(S.cart).map(([k,q])=>{const[id,ui]=k.split("|");const p=PM[id];if(!p)return null;const u=p.units[+ui]||p.units[0];return{k,p,ui:+ui,q,unit:u[0],price:u[1],mrp:u[2]}}).filter(Boolean)}
const cartCount=()=>Object.values(S.cart).reduce((a,b)=>a+b,0);
const COUPONS={FIRSTHARVEST:{d:"10% off up to ₹100 on orders above ₹299",calc:(sub)=>sub>=299?Math.min(100,sub*.1):0},MILLET20:{d:"20% off millets & rice",calc:(sub,lines)=>lines.filter(l=>l.p.cat==="millet").reduce((a,l)=>a+l.price*l.q,0)*.2}};
function bill(){const L=cartLines();const sub=L.reduce((a,l)=>a+l.price*l.q,0),mrp=L.reduce((a,l)=>a+l.mrp*l.q,0);
 const delivery=sub>=499||!sub?0:30;const coupon=S.coupon?Math.round(COUPONS[S.coupon].calc(sub,L)):0;const pts=S.usePoints?Math.min(S.points,Math.round(sub*.1)):0;const fund=S.farmerFund&&sub?5:0;
 return{L,sub,mrp,save:mrp-sub,delivery,coupon,pts,fund,total:Math.max(0,sub+delivery-coupon-pts+fund)}}
function slots(){const d=new Date(),h=d.getHours(),out=[];const today=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
 if(h<11)out.push({id:"t-eve",day:today,lbl:"Today",time:"5–7 PM",note:"Order before 11 AM"});
 [["6–8 AM","Harvested last evening"],["8–10 AM",""],["5–7 PM","Harvested same morning"]].forEach(([tm,n],i)=>out.push({id:"tm-"+i,day:today+DAY,lbl:"Tomorrow",time:tm,note:n}));
 out.push({id:"da-0",day:today+2*DAY,lbl:fmtDate(today+2*DAY,{weekday:"short",day:"numeric"}),time:"6–8 AM",note:""});return out}

/* running low */
function runningLow(){const last={};S.orders.filter(o=>o.stage>=4).forEach(o=>o.items.forEach(([id,ui])=>{if(!last[id]||last[id].date<o.date)last[id]={id,ui,date:o.date}}));
 return Object.values(last).filter(x=>!cartQty(x.id,x.ui)&&PM[x.id]).sort((a,b)=>a.date-b.date).slice(0,8)}

/* ================= UI PRIMITIVES ================= */
function pcard(p,extra=""){
 const ui=S.pdUnit[p.id]||0,u=p.units[ui],q=cartQty(p.id,ui),c=catOf(p);
 return `<article class="pcard">
  <button class="pimg" style="${tint(c.hue)}" data-a="go" data-r="product" data-id="${p.id}" aria-label="${esc(p.en)}">${p.e}${fitChip(p)}</button>
  <button class="pname" data-a="go" data-r="product" data-id="${p.id}">${vmark(p)}${esc(nm(p))}<span class="ta">${esc(nm2(p))}</span></button>
  <div class="small muted">${esc(u[0])} · ${esc(FARMS[p.farm].loc.split(",")[0])}${extra}</div>
  <div class="pfoot"><div class="price"><b>${inr(u[1])}</b>${u[2]>u[1]?`<s>${inr(u[2])}</s>`:""}</div>
  ${q?`<div class="stepper"><button data-a="dec" data-id="${p.id}" data-ui="${ui}" aria-label="Remove one">−</button><span>${q}</span><button data-a="inc" data-id="${p.id}" data-ui="${ui}" aria-label="Add one">+</button></div>`
     :`<button class="add" data-a="inc" data-id="${p.id}" data-ui="${ui}">${t("add")}</button>`}</div>
 </article>`}
function rcard(r){const serv=S.profile.household;return `<button class="rcard" data-a="go" data-r="recipe" data-id="${r.id}"><div class="rart">${r.e}</div><div class="rbody"><b>${esc(nm(r))}</b><span class="small muted">${r.mins} min · ${r.ing.length} ingredients · serves ${serv}</span><div class="chips">${r.tags.slice(0,2).map(g=>`<span class="chip ${S.profile.goals.includes(g)?"good":""}">${esc(TAGS[g].en)}</span>`).join("")}</div></div></button>`}
function searchBar(val=""){return `<div class="search" role="search">${svg("search")}<input id="q" type="search" placeholder="${esc(t("search"))}" value="${esc(val)}" data-in="q" aria-label="Search products"><button class="icon-btn" data-a="voice" aria-label="Voice search">${svg("mic")}</button><button class="icon-btn" data-a="photo" aria-label="Search with a photo of your list">${svg("cam")}</button></div>`}
function toast(msg){const el=document.createElement("div");el.className="toast";el.textContent=msg;const L=$("#toastLayer");L.innerHTML="";L.append(el);clearTimeout(toast.t);toast.t=setTimeout(()=>el.remove(),2200)}
function sheet(html){$("#layer").innerHTML=`<div class="scrim" data-a="closeSheet"><div class="sheet" role="dialog" aria-modal="true" data-stop><div class="grab"></div>${html}</div></div>`}
function closeSheet(){$("#layer").innerHTML=""}
const back=(r,label)=>`<button class="back" data-a="go" data-r="${r}">${svg("back")} ${esc(label)}</button>`;
</script>

 if(!b.L.length)return `<div class="empty"><div class="big">🧺</div><h2>Your basket is empty</h2><p class="muted">Start with this week's harvest or reorder your usuals.</p><button class="btn" data-a="go" data-r="shop">Browse the harvest</button></div>`;

async function serverSample(){
 try{const r=await fetch("api/health",{cache:"no-store"});if(!r.ok)return null;const h=await r.json();if(!h.ai)return null}catch(e){return null}
 const fail=(code,text)=>Object.assign(new Error(code),{code,text});
 const merge=turns=>{const out=[];for(const t of turns){const last=out[out.length-1];
  if(last&&last.role===t.role&&typeof last.content==="string"&&typeof t.content==="string")last.content+="\n\n"+t.content;else out.push({role:t.role,content:t.content})}return out};
 async function sample(turns,opts={}){
  const tools=opts.tools||[];const apiTools=tools.map(t=>({name:t.name,description:t.description,input_schema:t.inputSchema}));
  // The app sends its instructions as a leading user turn; send them as the system prompt.
  const lead=turns.length>1&&turns[0].role==="user"&&turns[1].role==="user";
  const system=lead?String(turns[0].content):"";let messages=merge(lead?turns.slice(1):turns);
  let all="";
  for(let round=0;round<6;round++){
   const sep=all?"\n\n":"";let part="";
   let res;try{res=await fetch("api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({system,messages,tools:apiTools}),signal:opts.signal})}
   catch(e){throw e.name==="AbortError"?fail("cancelled",all):fail("network",all)}
   if(!res.ok){const b=await res.json().catch(()=>({}));throw fail(b.code||"upstream_error",all)}
   const reader=res.body.getReader(),dec=new TextDecoder();let buf="",final=null;
   try{for(;;){const{value,done}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
    while((i=buf.indexOf("\n"))>=0){const line=buf.slice(0,i);buf=buf.slice(i+1);if(!line)continue;const ev=JSON.parse(line);
     if(ev.t==="d"){part+=ev.v;opts.onText?.({text:all+sep+part})}else if(ev.t==="m")final=ev;else if(ev.t==="e")throw fail(ev.code,all+sep+part)}}}
   catch(e){if(e.code)throw e;throw e.name==="AbortError"?fail("cancelled",all+sep+part):fail("network",all+sep+part)}
   if(!final)throw fail("network",all+sep+part);
   if(part)all+=sep+part;
   if(final.stop_reason==="refusal")throw fail("refused",all);
   const calls=final.content.filter(b=>b.type==="tool_use");
   if(final.stop_reason!=="tool_use"||!calls.length)return{text:all};
   const results=[];
   for(const c of calls){const tool=tools.find(t=>t.name===c.name);
    try{if(!tool||!c.input||typeof c.input!=="object")throw new Error("Unknown tool or invalid input");const out=await tool.execute(c.input);results.push({type:"tool_result",tool_use_id:c.id,content:typeof out==="string"?out:JSON.stringify(out)})}
    catch(e){results.push({type:"tool_result",tool_use_id:c.id,content:String(e.message||e),is_error:true})}}
   messages=[...messages,{role:"assistant",content:final.content},{role:"user",content:results}];
  }
  return{text:all};
 }
 async function toImage(file){
  // Downscale phone photos so uploads stay small; 1568px is plenty for reading a list.
  const url=URL.createObjectURL(file);try{const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
   const k=Math.min(1,1568/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
   c.getContext("2d").drawImage(img,0,0,c.width,c.height);return{media_type:"image/jpeg",data:c.toDataURL("image/jpeg",0.85).split(",")[1]}}
  finally{URL.revokeObjectURL(url)}}
 sample.limits=async()=>({tools:true,images:{mediaTypes:["image/jpeg","image/png","image/webp","image/gif"]}});
 sample.json=async(prompt,opts={})=>{const image=opts.images?await toImage(Array.isArray(opts.images)?opts.images[0]:opts.images):undefined;

  const b=await res.json().catch(()=>({}));if(!res.ok)throw fail(b.code||"upstream_error");return b.json};
 return sample;
}

 if(mode==="signup"){

  if(name.length<2)return err("Enter your name.");
  if(!/^[6-9]\d{9}$/.test(phone))return err("Enter a 10-digit Indian mobile number.");
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return err("Enter a valid email.");
  if(pw.length<6)return err("Password needs at least 6 characters.");
  if(Object.values(S.users).some(u=>u.email===email||u.phone===phone))return err("An account with this email or mobile already exists. Sign in instead.");
  const salt=Math.random().toString(36).slice(2),id="u"+Date.now().toString(36);
  const d=cloneDef();d.profile.name=name;
  const u={id,name,phone,email,salt,hash:await hashPw(salt,pw),created:Date.now(),
   data:{profile:d.profile,orders:[],subs:[],plan:{0:{b:null,m:null},1:{b:null,m:null},2:{b:null,m:null},3:{b:null,m:null},4:{b:null,m:null},5:{b:null,m:null},6:{b:null,m:null}},points:0,wallet:0,visits:[]}};
  S.users[id]=u;startSession(u);toast("Welcome to Vayal, "+name.split(" ")[0]);
 }else{
  const idv=v("au-id").toLowerCase(),ph=digits(idv);
  const u=Object.values(S.users).find(x=>x.email===idv||(ph&&x.phone===ph));
  if(!u||u.hash!==await hashPw(u.salt,pw))return err("Email, mobile or password is incorrect.");
  startSession(u);toast("Welcome back, "+u.name.split(" ")[0]);
 }}
function startSession(u){S.user=u;Object.assign(S,{visits:[]},u.data,{cart:S.cart});store.set("session",u.id);save();closeSheet();
 const next=afterAuth;afterAuth=null;render();if(next)next()}
function signOut(){save();S.user=null;store.set("session",null);Object.assign(S,cloneDef());save();go("home");toast("Signed out")}

/* ================= EVENTS ================= */
const A={
 farmGo:d=>{S.cam=0;go("farm",d.v);tickCam()}, cam:d=>{S.cam=+d.v;render();tickCam()}, visitNew:d=>sheetVisit(d.v), visitOk:d=>visitOk(d.v), farmShare:d=>farmShare(d.v,d.id), farmDist:d=>farmDist(d.v), visitView:d=>sheetVisitDone(d.id), visitIcs:d=>visitIcs(d.id),
 visitCancel:d=>{S.visits=S.visits.filter(x=>x.id!==d.id);save();render();toast("Visit cancelled")},
 auth:d=>sheetAuth(d.v||"signin"), authSubmit:d=>authSubmit(d.v), signout:signOut,
 go:d=>{if(d.chat&&!isWide())closeChat();go(d.r,d.id||undefined)},
 inc:d=>addCart(d.id,+d.ui||0,1,!!d.chat), dec:d=>addCart(d.id,+d.ui||0,-1),
 shopCat:d=>{S.shop.cat=d.v;go("shop")}, tag:d=>{S.shop.tag=S.shop.tag===d.v?null:d.v;render()}, tagShop:d=>{closeChat();S.shop.tag=d.v;S.shop.cat="all";go("shop")},
 fitOnly:()=>{S.profile.fitOnly=!S.profile.fitOnly;save();render()},
 unit:d=>{S.pdUnit[d.id]=+d.v;render()}, pdTab:d=>{S.pdTab=d.v;render()},
 lang:d=>{S.lang=d.v;save();render();if(S.chatOpen)renderChat()},
 phone:()=>{S.phone=!S.phone;$("#stage").classList.toggle("phone",S.phone);exitBtn();render()},
 addr:sheetAddr, setAddr:d=>{S.addr=+d.v;closeSheet();render();toast("Delivering to "+ADDR[S.addr].lbl)},
 slot:d=>{S.slot=d.v;render()}, coupon:d=>{S.coupon=S.coupon===d.v?null:d.v;render()},
 place:()=>{if(!S.user)return needAuth(A.place);const b=bill(),sl=slots().find(s=>s.id===S.slot)||slots()[0];
  if(S.pay==="wallet"&&S.wallet<b.total){toast("Wallet balance is low. Top up or pick another method.");return}
  const o={id:"VY-"+(24900+Math.floor(Math.random()*900)),date:Date.now(),items:b.L.map(l=>[l.p.id,l.ui,l.q,l.price]),total:Math.round(b.total),stage:0,pay:{upi:"UPI",card:"Card",wallet:"Wallet",cod:"Pay on delivery"}[S.pay],slot:sl.lbl+" "+sl.time,rating:{},otp:String(1000+Math.floor(Math.random()*9000))};
  if(S.pay==="wallet")S.wallet-=o.total;S.points=S.points-b.pts+Math.floor(b.total/20);S.orders.push(o);S.cart={};S.coupon=null;S.usePoints=false;save();toast("Order placed. The farms have your list.");go("track",o.id)},
 advance:d=>{const o=S.orders.find(x=>x.id===d.id);o.stage=Math.min(4,o.stage+1);save();render()},
 rate:d=>{const o=S.orders.find(x=>x.id===d.id);o.rating[d.p]=+d.v;save();render()},
 issue:d=>sheetIssue(d.id), issR:(d,el)=>{el.parentNode.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===el))},
 issOk:()=>{const r=document.querySelector('input[name="iss"]:checked');const amt=+r.dataset.price;S.wallet+=amt;save();closeSheet();render();toast(`Refunded ${inr(amt)} to your wallet`)},
 invoice:d=>sheetInvoice(d.id),
 reorder:d=>{const o=S.orders.find(x=>x.id===d.id);o.items.forEach(([pid,ui,q])=>{const k=key(pid,ui);S.cart[k]=Math.max(S.cart[k]||0,q)});save();toast("Added your usual items");go("cart")},
 addAllLow:()=>{runningLow().forEach(x=>addCart(x.id,x.ui,1,true));toast("Added to cart");render()},
 skipTmr:()=>{const k=dkey(Date.now()+DAY);S.subs.forEach(s=>{if(deliversOn(s,Date.now()+DAY)&&!s.skips.includes(k))s.skips.push(k)});save();render();toast("Tomorrow's delivery skipped")},
 subQ:d=>{const s=S.subs.find(x=>x.id===d.id);s.q=Math.max(1,s.q+ +d.v);save();render()},
 subPause:d=>{const s=S.subs.find(x=>x.id===d.id);s.status=s.status==="active"?"paused":"active";save();render()},
 subDel:d=>{S.subs=S.subs.filter(x=>x.id!==d.id);save();render();toast("Subscription removed")},
 skipDay:d=>{const s=S.subs.find(x=>x.id===d.id);s.skips=s.skips.includes(d.v)?s.skips.filter(k=>k!==d.v):[...s.skips,d.v];save();render()},
 vacation:sheetVacation, vacSet:d=>{const n=+d.v;S.subs.forEach(s=>{s.until=n?dkey(Date.now()+n*DAY):undefined});save();closeSheet();render();toast(n?`Paused for ${n} days`:"Deliveries resumed")},
 topup:()=>{S.wallet+=500;save();render();toast("₹500 added via UPI")},
 subscribe:d=>sheetSubscribe(d.id),
 house:d=>{S.profile.household=Math.min(12,Math.max(1,S.profile.household+ +d.v));save();render()},
 serv:d=>{S.recipeServ[d.id]=Math.max(1,(S.recipeServ[d.id]||S.profile.household)+ +d.v);render()},
 autoPlan, aiPlan:(d,el)=>aiPlan(el), planCart:sheetPlanCart,
 planCartOk:()=>{document.querySelectorAll("[data-pc]").forEach(c=>{if(c.checked&&+c.dataset.n)addCart(c.dataset.pc,0,+c.dataset.n,true)});closeSheet();render();toast("Week's ingredients added")},
 pickMeal:d=>sheetPickMeal(+d.d,d.k), setMeal:d=>{S.plan[d.d]=S.plan[d.d]||{};S.plan[d.d][d.k]=d.v||null;save();closeSheet();render()},
 recipeCart:d=>{addRecipe(d.id,S.recipeServ[d.id]||S.profile.household);render();toast("Ingredients added to cart")},
 toPlan:d=>{const r=RM[d.id],k=r.meal==="breakfast"?"b":"m";let i=0;for(;i<7;i++)if(!S.plan[i]?.[k])break;if(i===7)i=0;S.plan[i]=S.plan[i]||{};S.plan[i][k]=r.id;save();toast(`Added to ${fmtDate(planDays()[i],{weekday:"long"})}`)},
 diet:d=>{S.profile.diet=d.v;save();render()},
 goal:d=>{const g=S.profile.goals;S.profile.goals=g.includes(d.v)?g.filter(x=>x!==d.v):[...g,d.v];save();render()},
 allergen:d=>{const g=S.profile.allergens;S.profile.allergens=g.includes(d.v)?g.filter(x=>x!==d.v):[...g,d.v];save();render()},
 refer:sheetRefer, copyRef:()=>{const t="PRABU100";navigator.clipboard?.writeText(t).then(()=>toast("Code copied"),()=>{const r=document.createRange();r.selectNodeContents($("#refcode"));getSelection().removeAllRanges();getSelection().addRange(r)})},
 voice:sheetVoice, tryQ:d=>{closeSheet();S.shop.q=d.v;S.shop.cat="all";go("shop")},
 photo:photoSearch, demoList:()=>showParsed(SAMPLE_LIST.split("\n").map(l=>{const m=l.match(/^(.*?)(\s+\d.*)?$/);return{item:m[1],qty:(m[2]||"").trim()}}),"Sample list (Tanglish)"),
 psOk:()=>{let n=0;document.querySelectorAll("[data-ps]").forEach(c=>{if(c.checked){addCart(c.dataset.ps,0,1,true);n++}});closeSheet();render();toast(`${n} items added`)},
 askAbout:d=>openChat(d.v), chatSugg:d=>{if(!S.chatOpen)openChat(d.v);else sendChat(d.v)}, chatClose:()=>closeChat(),
 closeSheet:()=>closeSheet()
};
const isWide=()=>$("#app").clientWidth>=820;
function closeChat(){ctl?.abort();S.chatOpen=false;renderChat();renderTop()}
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a;
 if(a==="closeSheet"&&e.target!==el)return;
 if(sheetSubscribe.h&&a.startsWith("ss-")){sheetSubscribe.h[a](el.dataset.v);return}
 const fn=A[a];if(fn){e.preventDefault();fn(el.dataset,el)}});
document.addEventListener("input",e=>{const el=e.target;const k=el.dataset.in;if(k==="q"){S.shop.q=el.value;if(S.route.name!=="shop"){S.shop.cat="all";S.route={name:"shop"};}render()}});
document.addEventListener("change",e=>{const el=e.target,k=el.dataset.in;if(!k)return;
 if(k==="sort")S.shop.sort=el.value;if(k==="pts")S.usePoints=el.checked;if(k==="crate")S.crate=el.checked;if(k==="fund")S.farmerFund=el.checked;
 if(k==="addr")S.addr=+el.value;if(k==="pay")S.pay=el.value;if(k==="fitonly")S.profile.fitOnly=el.checked;if(k==="notif")S.profile.notif[el.dataset.v]=el.checked;
 if(k==="freq"){const s=S.subs.find(x=>x.id===el.dataset.id);s.freq=el.value}
 save();if(k!=="q")render()});
document.addEventListener("submit",e=>{if(e.target.id==="composer"){e.preventDefault();if(S.busy){ctl?.abort();return}const i=$("#chatIn");const v=i.value;i.value="";sendChat(v)}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id&&e.target.id.startsWith("au-")){e.preventDefault();$("[data-a=authSubmit]")?.click()}if(e.key==="Escape"){if($("#layer").innerHTML)closeSheet();else if(S.chatOpen)closeChat()}});
$("#fab").addEventListener("click",()=>openChat());
$("#photoInput").addEventListener("change",e=>{const f=e.target.files[0];if(f)readPhoto(f)});
function exitBtn(){let b=$("#exitPhone");if(S.phone&&!b){b=document.createElement("button");b.id="exitPhone";b.className="pill-btn";b.dataset.a="phone";b.textContent="← Back to web view";b.style.cssText="justify-self:center;margin-bottom:12px";$("#stage").prepend(b)}else if(!S.phone&&b)b.remove()}
render();
</script>
