# Render Blueprint: runs the Vayal storefront plus its AI backend (server.js).
services:
  - type: web
    name: vayal
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Your Anthropic API key. Render asks for it when you create the Blueprint.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional limits to control spend (defaults shown).
      - key: AI_REQUESTS_PER_IP_PER_HOUR
        value: "60"
      - key: AI_REQUESTS_PER_DAY
        value: "2000"
